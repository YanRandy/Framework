<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultat du Contrôleur - Randy Framework</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-top: 5px solid #4f46e5;
        }
        h1 {
            color: #1e1b4b;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card-content {
            background-color: #fdfdfd;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 20px;
            margin-top: 15px;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            border-top: 1px solid #f3f4f6;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Résultat du Contrôleur</h1>
        <div class="subtitle">Moteur de rendu HtmlViewRenderer</div>
        
        <p>Voici la liste des messages transmis dynamiquement par votre application :</p>
        
        <div class="card-content">
            {message}
        </div>

        <div class="footer">
            Généré avec succès par le <strong>Randy Framework</strong>
        </div>
    </div>

</body>
</html>
